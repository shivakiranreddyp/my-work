name: Node.js Docker CI/CD
on:
  push:
    branches:
      - main
      - feature/*
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build Docker image
      - name: Build Docker image
        run: docker build -t spullagurla24/node-app:latest .

      # 7. Push Docker image
      - name: Push Docker image
        run: docker push spullagurla24/node-app:latest

      # 8. Deploy (example on remote server via SSH)
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull spullagurla24/node-app:latest
            docker stop node-app || true
            docker rm node-app || true
            docker run -d -p 8082:3000 --name node-app spullagurla24/node-app:latest
